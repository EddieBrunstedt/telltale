[package]
name = "telltale"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Gauges that stay dark until something needs your attention"

[dependencies]
libc = "0.2"
# ring rather than the default aws-lc-rs: no C/cmake build for one IMAP client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
